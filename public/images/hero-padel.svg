<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="courtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d1a" />
      <stop offset="50%" stop-color="#102e29" />
      <stop offset="100%" stop-color="#071412" />
    </linearGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#c8ee5a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#courtBg)" />
  <!-- Court perspective wireframe -->
  <polygon points="200,750 1000,750 850,320 350,320" fill="#0d2b25" stroke="#c8ee5a" stroke-width="4" stroke-opacity="0.8" />
  <!-- Center Service Line -->
  <line x1="600" y1="750" x2="600" y2="400" stroke="#f5f7f6" stroke-width="4" stroke-opacity="0.9" />
  <!-- Service Line -->
  <line x1="280" y1="580" x2="920" y2="580" stroke="#f5f7f6" stroke-width="4" stroke-opacity="0.9" />
  <!-- Net -->
  <polygon points="320,400 880,400 890,430 310,430" fill="url(#glassWall)" stroke="#c8ee5a" stroke-width="2" />
  <line x1="320" y1="400" x2="880" y2="400" stroke="#ffffff" stroke-width="3" />
  <!-- Glass Backwall -->
  <polygon points="350,320 850,320 850,220 350,220" fill="url(#glassWall)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />
  <!-- Decorative Accent Glows -->
  <circle cx="600" cy="450" r="160" fill="#c8ee5a" fill-opacity="0.08" filter="blur(40px)" />
  <!-- Padel Ball -->
  <circle cx="720" cy="520" r="18" fill="#c8ee5a" />
  <path d="M710 510 Q720 520 710 530" stroke="#0d211f" stroke-width="2" fill="none" />
  <path d="M730 510 Q720 520 730 530" stroke="#0d211f" stroke-width="2" fill="none" />
  <text x="600" y="830" fill="#c3d2cf" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" letter-spacing="4" text-anchor="middle">PADELHUB INDONESIA — ARENA CENTER</text>
</svg>
